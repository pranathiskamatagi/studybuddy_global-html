<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Back - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="login.css?v=2" />
</head>
<body>

  <div class="app-screen">

    <!-- Decorative globe circle, same trick as the signup page -->
    <div class="globe-decor"></div>

    <div class="logo-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.5 4 5.5 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.5-4-9s1.5-6.5 4-9z"></path></svg>
    </div>

    <h1 class="title">Welcome <span class="accent">Back!</span></h1>
    <p class="subtitle">Log in to keep your streak going</p>

    <form id="login-form" class="login-form" novalidate>

      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3 7l9 6 9-6"></path>
          </svg>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />

          <button type="button" id="toggle-password" class="icon-button" aria-label="Show password">
            <svg class="input-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="input-icon eye-closed" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18"></path>
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-3.22 4.36M6.1 6.1A18.6 18.6 0 0 0 1 12s2.5 4.5 7 6.5"></path>
              <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path>
            </svg>
          </button>
        </div>
      </div>

      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

      <p id="form-error" class="form-error" hidden></p>

      <button type="submit" class="cta-button">
        Log In
        <span class="arrow">→</span>
      </button>
    </form>

    <div class="divider-row">
      <span class="line"></span>
      <span>or</span>
      <span class="line"></span>
    </div>

    <button type="button" class="oauth-button" data-provider="Google">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.77-2.4 3.62v3h3.88c2.27-2.09 3.57-5.17 3.57-8.81z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.92l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.11C3.25 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.27A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.27V6.62H1.27A11.98 11.98 0 0 0 0 12c0 1.93.46 3.76 1.27 5.38l4-3.11z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.62l4 3.11C6.22 6.86 8.87 4.75 12 4.75z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <button type="button" class="oauth-button" data-provider="Apple">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="#000000">
        <path d="M16.365 1.43c0 1.14-.47 2.24-1.22 3.04-.83.87-2.15 1.55-3.24 1.46-.14-1.1.42-2.27 1.19-3.05.83-.87 2.28-1.51 3.27-1.45zM20.53 17.09c-.44 1.02-.65 1.47-1.22 2.38-.79 1.26-1.9 2.83-3.28 2.84-1.22.02-1.53-.8-3.19-.79-1.66.01-2 .81-3.22.79-1.38-.02-2.43-1.44-3.22-2.7-2.2-3.51-2.44-7.63-1.08-9.83.97-1.56 2.5-2.47 3.94-2.47 1.47 0 2.39.81 3.61.81 1.18 0 1.9-.81 3.61-.81 1.28 0 2.64.7 3.6 1.9-3.17 1.74-2.66 6.27.05 7.88z"/>
      </svg>
      <span>Continue with Apple</span>
    </button>

    <p class="signup-row">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

  <script src="api.js?v=5"></script>
  <script src="login.js"></script>
</body>
</html>
