<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiting for Members - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Reuses connecting.css - same "two avatars linked by a pulsing
       line" visual works just as well for "waiting for people to join"
       as it does for "finding your match". -->
  <link rel="stylesheet" href="connecting.css?v=2" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
</head>
<body>

  <div class="app-screen">

    <p class="kicker">Group chat created</p>

    <div class="topic-box">
      <div class="topic-main">
        <span class="topic-label">Topic</span>
        <span class="topic-value" id="topic-value">—</span>
      </div>
    </div>

    <h1 class="title">Finding members<span id="waiting-dots"></span></h1>

    <div class="matching-visual" aria-hidden="true">
      <div class="match-avatar avatar-you">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
      </div>
      <div class="match-line">
        <span class="pulse-dot"></span>
      </div>
      <div class="match-avatar avatar-globe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.5 4 5.5 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.5-4-9s1.5-6.5 4-9z"></path></svg>
      </div>
    </div>

    <p class="reassurance">You're in - this page will jump straight into the group chat the moment someone else joins.</p>

    <button type="button" class="cancel-btn" id="cancel-btn">Leave and cancel</button>
  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="group-waiting.js"></script>
</body>
</html>
