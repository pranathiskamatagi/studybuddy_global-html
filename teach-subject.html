<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teach a Subject - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="teach-subject.css" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill"></div>
      </div>
    </div>

    <p class="kicker">I wanna teach</p>
    <h1 class="title">Choose subject &amp; topic</h1>
    <p class="subtitle">Tell us what you'd like to teach and we'll match you with students.</p>

    <form id="teach-form" novalidate>

      <div class="field">
        <label for="subject">Subject</label>
        <div class="select-wrap">
          <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10 4.5 7 4 4 4v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"></path></svg>
          <input type="text" id="subject" list="subject-options" placeholder="Select or type a subject" autocomplete="off" />
          <datalist id="subject-options"></datalist>
        </div>
      </div>

      <div class="field">
        <label for="topic">Topic</label>
        <div class="select-wrap">
          <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
          <input type="text" id="topic" list="topic-options" placeholder="Select or type a topic" autocomplete="off" />
          <datalist id="topic-options"></datalist>
        </div>
      </div>

      <!-- ============ RECENT SEARCHES (clickable chips) ============ -->
      <!-- teach-subject.js fills this in with this user's REAL past
           searches (from the backend) - hidden entirely until there's at
           least one real one, never seeded with fake examples. -->
      <div class="chip-section" id="recent-section" hidden>
        <p class="chip-heading">Recent searches</p>
        <div class="chip-row" id="recent-chips"></div>
      </div>

      <!-- ============ RECOMMENDED (clickable chips) ============ -->
      <div class="chip-section">
        <p class="chip-heading">Recommended for you</p>
        <div class="chip-row" id="recommended-chips">
          <button type="button" class="chip chip-recommended" data-subject="Computer Science" data-topic="Data Structures">Data Structures</button>
          <button type="button" class="chip chip-recommended" data-subject="Arts &amp; Writing" data-topic="Creative Writing">Creative Writing</button>
          <button type="button" class="chip chip-recommended" data-subject="Mathematics" data-topic="Algebra II">Algebra II</button>
          <button type="button" class="chip chip-recommended" data-subject="Arts &amp; Writing" data-topic="Public Speaking">Public Speaking</button>
          <button type="button" class="chip chip-recommended" data-subject="Science" data-topic="Biology 101">Biology 101</button>
        </div>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <!-- Unlike the "learn" flow's gradient "Find study partner" button,
           this is a plain list-style row - it leads to a quiz step first,
           not straight into matching, so it shouldn't look like the same
           kind of action. -->
      <button type="submit" class="quiz-card">
        <div class="quiz-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>
        <div class="quiz-text">
          <p class="quiz-title">Quick quiz</p>
          <p class="quiz-subtitle">Make sure you know the topic before you teach it</p>
        </div>
        <svg class="quiz-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </form>
  </div>

  <script src="api.js?v=5"></script>
  <script src="socket.io.min.js"></script>
  <script src="teach-subject.js"></script>
</body>
</html>
