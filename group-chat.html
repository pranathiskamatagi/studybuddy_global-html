<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Chat - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="group-chat.css" />
  <link rel="stylesheet" href="confirm-modal.css" />
</head>
<body>

  <div class="app-screen">

    <!-- ============ HEADER ============ -->
    <div class="chat-header">
      <div class="chat-partner">
        <!-- An overlapping avatar stack (same idea as home.html's
             session cards) instead of one person's avatar. -->
        <div class="group-avatar-stack" id="group-avatar-stack"></div>
        <div>
          <p class="partner-name-sm" id="group-topic">Group Chat</p>
          <p class="partner-status" id="group-member-count">4 members</p>
        </div>
      </div>

      <div class="chat-actions">
        <button type="button" id="end-session-btn" class="end-session-btn">Exit chat</button>

        <div class="safety-menu-wrap">
          <button type="button" id="safety-btn" class="icon-btn-sm" aria-label="Safety options" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18"></path><path d="M4 4h13l-2 4 2 4H4"></path></svg>
          </button>
          <div class="safety-menu" id="safety-menu" hidden>
            <button type="button" id="report-btn" class="safety-option">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18"></path><path d="M4 4h13l-2 4 2 4H4"></path></svg>
              Report
            </button>
            <!-- "Leave group" replaces "Block" here - blocking a single
                 person doesn't map cleanly onto a group conversation,
                 but leaving the group does. -->
            <button type="button" id="leave-btn" class="safety-option safety-option-danger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
              Leave group
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ MESSAGES ============ -->
    <!-- Received bubbles show a small sender name above them, since -
         unlike the 1-on-1 chat - "who said this" isn't obvious here. -->
    <div class="chat-messages" id="chat-messages">
      <div class="msg msg-received">
        <p class="msg-sender">Sofia Martinez</p>
        <p>Hey everyone! Ready to get started? 😊</p>
      </div>
      <div class="msg msg-received">
        <p class="msg-sender">Kabir Singh</p>
        <p>Yep, been looking forward to this all week.</p>
      </div>
      <div class="msg msg-sent"><p>Same here, let's dive in!</p></div>
    </div>

    <p class="typing-indicator" id="typing-indicator" hidden>
      <span id="typing-name"></span> is typing
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </p>

    <!-- ============ INPUT BAR ============ -->
    <form id="chat-form" class="chat-input-row">
      <button type="button" id="image-btn" class="input-icon-btn" aria-label="Send an image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5-9 9"></path></svg>
      </button>
      <button type="button" id="mic-btn" class="input-icon-btn" aria-label="Send a voice message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 19v3"></path></svg>
      </button>
      <input type="text" id="chat-input" placeholder="Type a message" autocomplete="off" />
      <button type="submit" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
      </button>
    </form>
  </div>

  <script src="confirm-modal.js"></script>
  <script src="group-chat.js"></script>
</body>
</html>
