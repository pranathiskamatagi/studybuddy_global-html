<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>Group Chat - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="group-chat.css?v=8" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="profile-view-modal.css?v=3" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <link rel="stylesheet" href="phone-zoom.css?v=1" />
</head>
<body>

  <div class="app-screen">

    <!-- ============ HEADER ============ -->
    <div class="chat-header">
      <div class="chat-partner">
        <!-- An overlapping avatar stack (same idea as home.html's
             session cards) instead of one person's avatar. Clicking it
             opens the full member list (see #members-overlay below). -->
        <button type="button" class="group-avatar-stack" id="group-avatar-stack" aria-label="View group members"></button>
        <div>
          <p class="partner-name-sm" id="group-topic">Group Chat</p>
          <p class="partner-status" id="group-member-count">4 members</p>
        </div>
      </div>

      <div class="chat-actions">
        <button type="button" id="end-session-btn" class="end-session-btn">Exit session</button>

        <div class="safety-menu-wrap">
          <button type="button" id="safety-btn" class="icon-btn-sm" aria-label="Safety options" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18"></path><path d="M4 4h13l-2 4 2 4H4"></path></svg>
          </button>
          <!-- Report/Block a group are ambiguous actions - group-chat.js
               shows a member picker first (built from the real member
               list), then re-uses THIS SAME menu to confirm the chosen
               person, same as picking a person then a Report/Block on a
               1-on-1 chat. "Leave group" was removed - it duplicated
               "Exit session" above (now the one, real way to leave). -->
          <div class="safety-menu" id="safety-menu" hidden>
            <button type="button" id="report-btn" class="safety-option">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18"></path><path d="M4 4h13l-2 4 2 4H4"></path></svg>
              Report a member
            </button>
            <button type="button" id="block-btn" class="safety-option safety-option-danger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M4.93 4.93l14.14 14.14"></path></svg>
              Block a member
            </button>
          </div>
          <!-- The member picker - group-chat.js fills this with the real
               current members (never yourself) and swaps it in for the
               menu above when Report/Block a member is clicked. -->
          <div class="safety-menu" id="member-picker-menu" hidden></div>
        </div>
      </div>
    </div>

    <!-- ============ MEMBERS OVERLAY ============ -->
    <!-- group-chat.js fills member-list-body with one row per real
         current member, each clickable to the shared profile view. -->
    <div class="members-overlay" id="members-overlay" hidden>
      <div class="members-card">
        <div class="members-header">
          <p class="members-title">Group members</p>
          <button type="button" class="members-close-btn" id="members-close-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="member-list-body" id="member-list-body"></div>
      </div>
    </div>

    <!-- ============ MESSAGES ============ -->
    <!-- Received bubbles show a small sender name above them, since -
         unlike the 1-on-1 chat - "who said this" isn't obvious here.
         group-chat.js fills this with the real message history. -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- group-chat.js shows/hides this live via the 'partner_typing'
         socket event - never a fake indicator, only real keystrokes. -->
    <p class="typing-indicator" id="typing-indicator" hidden></p>

    <!-- ============ INPUT BAR ============ -->
    <form id="chat-form" class="chat-input-row">
      <button type="button" id="image-btn" class="input-icon-btn" aria-label="Send an image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5-9 9"></path></svg>
      </button>
      <!-- Hidden - image-btn above just clicks this, same pattern as
           session.html's photo picker. -->
      <input type="file" id="image-file-input" accept="image/*" hidden />
      <button type="button" id="mic-btn" class="input-icon-btn" aria-label="Send a voice message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 19v3"></path></svg>
      </button>
      <!-- A textarea, not a single-line input - grows taller as a long
           message wraps instead of scrolling sideways inside a fixed-
           height box (see group-chat.js's auto-resize + Enter-to-send). -->
      <textarea id="chat-input" placeholder="Type a message" rows="1"></textarea>
      <button type="submit" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
      </button>
    </form>

    <!-- Replaces the input row above while actually recording, or
         previewing a just-finished recording before it's really sent -
         see group-chat.js's recording bar wiring. -->
    <div class="recording-bar" id="recording-bar" hidden>
      <div class="recording-controls" id="recording-controls">
        <button type="button" id="recording-cancel-btn" class="recording-cancel-btn" aria-label="Cancel recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
        </button>
        <span class="recording-dot" id="recording-dot"></span>
        <span class="recording-time" id="recording-time">0:00</span>
        <span class="recording-hint" id="recording-hint">Recording voice message...</span>
        <button type="button" id="recording-pause-btn" class="recording-pause-btn" aria-label="Pause recording">
          <svg id="recording-pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <svg id="recording-resume-icon" hidden viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <button type="button" id="recording-stop-btn" class="recording-send-btn" aria-label="Stop recording">
          <svg viewBox="0 0 24 24" fill="white" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
        </button>
      </div>
      <!-- Shown once recording stops - listen back before actually
           sending, instead of it going out the instant recording ends. -->
      <div class="recording-preview" id="recording-preview" hidden>
        <button type="button" id="preview-discard-btn" class="recording-cancel-btn" aria-label="Discard recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
        </button>
        <div class="recording-preview-player" id="recording-preview-player"></div>
        <button type="button" id="preview-send-btn" class="recording-send-btn" aria-label="Send voice message">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="confirm-modal.js"></script>
  <script src="profile-view-modal.js?v=4"></script>
  <script src="dark-mode.js"></script>
  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="sound.js"></script>
  <script src="safety-check.js"></script>
  <script src="audio-player.js?v=1"></script>
  <script src="image-viewer.js?v=1"></script>
  <script src="group-chat.js?v=10"></script>
</body>
</html>
