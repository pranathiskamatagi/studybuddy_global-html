<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="session.css" />
  <link rel="stylesheet" href="confirm-modal.css" />
</head>
<body>

  <div class="app-screen">

    <!-- ============ HEADER ============ -->
    <div class="chat-header">
      <div class="chat-partner">
        <!-- session.js fills these in from the URL (?partner=..&color=..)
             passed along by match-found.js's "Start Session" button. -->
        <div class="partner-avatar-sm" id="chat-avatar">P</div>
        <div>
          <p class="partner-name-sm" id="chat-partner-name">Study Partner</p>
          <p class="partner-status">Active now</p>
        </div>
      </div>

      <div class="chat-actions">
        <button type="button" id="end-session-btn" class="end-session-btn">End session</button>

        <!-- A small dropdown menu, toggled open/closed by JS - see the
             "safety menu" section of session.js for how it works. -->
        <div class="safety-menu-wrap">
          <button type="button" id="safety-btn" class="icon-btn-sm" aria-label="Safety options" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18"></path><path d="M4 4h13l-2 4 2 4H4"></path></svg>
          </button>
          <div class="safety-menu" id="safety-menu" hidden>
            <button type="button" id="report-btn" class="safety-option">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18"></path><path d="M4 4h13l-2 4 2 4H4"></path></svg>
              Report
            </button>
            <button type="button" id="block-btn" class="safety-option safety-option-danger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M5.5 5.5l13 13"></path></svg>
              Block
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ MESSAGES ============ -->
    <div class="chat-messages" id="chat-messages">
      <div class="msg msg-received"><p>Hey! Ready to get started? 😊</p></div>
      <div class="msg msg-sent"><p>Yes, I've been looking forward to this!</p></div>
      <div class="msg msg-received"><p>Awesome. Let's dive in whenever you're ready.</p></div>
    </div>

    <!-- Hidden by default - session.js reveals this while a reply is
         being "typed" after you send a message. -->
    <p class="typing-indicator" id="typing-indicator" hidden>
      <span id="typing-name"></span> is typing
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </p>

    <!-- ============ INPUT BAR ============ -->
    <form id="chat-form" class="chat-input-row">
      <button type="button" id="image-btn" class="input-icon-btn" aria-label="Send an image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5-9 9"></path></svg>
      </button>
      <button type="button" id="mic-btn" class="input-icon-btn" aria-label="Send a voice message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 19v3"></path></svg>
      </button>
      <input type="text" id="chat-input" placeholder="Type a message" autocomplete="off" />
      <button type="submit" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
      </button>
    </form>
  </div>

  <script src="confirm-modal.js"></script>
  <script src="session.js"></script>
</body>
</html>
