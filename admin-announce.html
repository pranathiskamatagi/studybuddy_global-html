<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.65, minimum-scale=0.5" />
  <title>Send Announcement - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css?v=5" />
  <link rel="stylesheet" href="admin-announce.css" />
  <link rel="stylesheet" href="points-popup.css?v=4" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="admin.html" class="back-btn" aria-label="Back to admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">🛡 Admin</p>
    </div>

    <h1 class="title">Send announcement</h1>
    <p class="subtitle">Goes out as a real notification to every user right now.</p>

    <form id="announce-form" novalidate>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="e.g. App updated with new features!" required></textarea>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <button type="submit" class="save-btn">Send to everyone</button>
    </form>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="sound.js"></script>
  <script src="points-popup.js"></script>
  <script src="admin-announce.js"></script>
</body>
</html>
