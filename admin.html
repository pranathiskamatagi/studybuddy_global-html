<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.65, minimum-scale=0.5" />
  <title>Admin - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css?v=5" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">🛡 Admin</p>
    </div>

    <h1 class="title">Admin tools</h1>
    <p class="subtitle">Visible only on your account.</p>

    <div class="admin-stats-row" id="admin-stats-row">
      <a href="admin-users.html" class="admin-stat">
        <p class="admin-stat-value" id="stat-total-users">—</p>
        <p class="admin-stat-label">Users</p>
      </a>
      <a href="admin-reports.html" class="admin-stat">
        <p class="admin-stat-value" id="stat-open-reports">—</p>
        <p class="admin-stat-label">Open reports</p>
      </a>
      <a href="admin-users.html?filter=banned" class="admin-stat">
        <p class="admin-stat-value" id="stat-banned-users">—</p>
        <p class="admin-stat-label">Banned</p>
      </a>
    </div>

    <div class="settings-group">
      <a href="admin-live.html" class="link-row">
        <span>🔴 Live now</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="admin-conversations.html" class="link-row">
        <span>Conversation summary</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="admin-reports.html" class="link-row">
        <span>Reports <span class="pending-count" id="pending-reports-count" hidden></span></span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="admin-blocks.html" class="link-row">
        <span>Blocks</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="admin-users.html" class="link-row">
        <span>Manage users</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="admin-support.html" class="link-row">
        <span>Support messages</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="admin-ratings.html" class="link-row">
        <span>Manage ratings</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="admin-announce.html" class="link-row">
        <span>Send announcement</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </div>

    <h2 class="people-heading">Registered people <span id="people-count"></span></h2>
    <div class="people-list" id="people-list"></div>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="admin.js?v=3"></script>
</body>
</html>
