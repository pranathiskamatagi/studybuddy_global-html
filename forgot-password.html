<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=487" />
  <title>Reset Password - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="forgot-password.css?v=2" />
  <link rel="stylesheet" href="points-popup.css?v=4" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=5" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="login.html" class="back-btn" id="back-btn" aria-label="Back to login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Reset password</p>
    </div>

    <h1 class="title">Forgot your password?</h1>
    <p class="subtitle" id="step-subtitle">Enter your account email and we'll send you a code.</p>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>

      <div id="step2" hidden>
        <div class="field">
          <label for="code">6-digit code from your email</label>
          <input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
          <p class="field-hint">It works for 10 minutes. <a href="#" id="resend-link">Send a new code</a></p>
        </div>

      <div class="field">
        <label for="new-password">New password</label>
        <div class="password-wrap">
          <input type="password" id="new-password" autocomplete="new-password" required />
          <button type="button" class="toggle-password-btn" data-target="new-password" aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-3.22 4.36M6.1 6.1A18.6 18.6 0 0 0 1 12s2.5 4.5 7 6.5"></path><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path></svg>
          </button>
        </div>
        <p class="field-hint">At least 8 characters.</p>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <div class="password-wrap">
          <input type="password" id="confirm-password" autocomplete="new-password" required />
          <button type="button" class="toggle-password-btn" data-target="confirm-password" aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-3.22 4.36M6.1 6.1A18.6 18.6 0 0 0 1 12s2.5 4.5 7 6.5"></path><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path></svg>
          </button>
        </div>
      </div>

      </div>

      <p id="form-error" class="form-error" hidden></p>

      <button type="submit" class="save-btn" id="submit-btn">Send code</button>
    </form>
  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="sound.js"></script>
  <script src="points-popup.js"></script>
  <script src="forgot-password.js?v=2"></script>
</body>
</html>
