<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyBuddy Global - Sign Up</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="signup-container">

<div class="signup-card">

<div class="robot">🤖</div>

<h1>Create Account</h1>

<p class="subtitle">
Join thousands of students learning together worldwide.
</p>

<form id="signupForm">

<input type="text" id="fullName" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<label class="terms">
<input type="checkbox" id="terms">
I agree to the Terms & Privacy Policy
</label>

<button type="submit">Create Account</button>

</form>

<p class="login-link">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</div>
<script src="signup.js"></script>
</body>

</html>
<p style="font-size:12px;color:#64748B;margin:-10px 0 16px;text-align:left;">
  🔒 Your email is private and never shown to other students.
</p>
