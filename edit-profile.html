<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=417" />
  <title>Edit Profile - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="edit-profile.css?v=3" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=6" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="profile.html" class="back-btn" aria-label="Back to profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Edit profile</p>
    </div>

    <!-- Click the avatar to pick a new photo - edit-profile.js resizes it
         client-side before it's ever sent anywhere. -->
    <button type="button" id="avatar-btn" class="avatar-btn-wrap" aria-label="Change profile photo">
      <div class="avatar-preview avatar-blue" id="avatar-preview" aria-hidden="true">P</div>
      <span class="avatar-edit-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      </span>
    </button>
    <input type="file" id="photo-input" accept="image/*" hidden />

    <form id="edit-form" novalidate>
      <div class="field">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" required />
      </div>

      <div class="field">
        <label for="country">Country</label>
        <div class="select-wrap">
          <select id="country" required></select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>

      <div class="field">
        <label for="grade">Grade</label>
        <div class="select-wrap">
          <select id="grade" required></select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>

      <div class="field">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="3" placeholder="Tell other students a bit about yourself" maxlength="160"></textarea>
        <p class="char-count" id="char-count">0/160</p>
      </div>

      <div class="field">
        <label for="teach-subject-input">Subjects you teach</label>
        <p class="field-hint" style="margin-top: -4px; margin-bottom: 8px;">Shown on your profile so others can find you before you've ever matched.</p>
        <div class="teach-tag-input-row">
          <input type="text" id="teach-subject-input" placeholder="e.g. Algebra" />
          <button type="button" id="add-teach-subject-btn" class="add-tag-btn">Add</button>
        </div>
        <div class="teach-tag-row" id="teach-tag-row"></div>
      </div>

      <button type="submit" class="save-btn">Save changes</button>
    </form>
  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="edit-profile.js?v=2"></script>
</body>
</html>
