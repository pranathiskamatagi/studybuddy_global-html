<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="edit-profile.css" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="profile.html" class="back-btn" aria-label="Back to profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Edit profile</p>
    </div>

    <div class="avatar-preview avatar-blue" aria-hidden="true">P</div>

    <form id="edit-form" novalidate>
      <div class="field">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" required />
      </div>

      <div class="field">
        <label for="country">Country</label>
        <div class="select-wrap">
          <select id="country" required></select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>

      <div class="field">
        <label for="grade">Grade</label>
        <div class="select-wrap">
          <select id="grade" required></select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>

      <div class="field">
        <label for="language">Language</label>
        <div class="select-wrap">
          <select id="language" required></select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>

      <div class="field">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="3" placeholder="Tell other students a bit about yourself" maxlength="160"></textarea>
        <p class="char-count" id="char-count">0/160</p>
      </div>

      <button type="submit" class="save-btn">Save changes</button>
    </form>
  </div>

  <script src="edit-profile.js"></script>
</body>
</html>
