<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=584" />
  <title>Profile - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="profile.css?v=3" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Profile</p>
    </div>

    <!-- ============ HEADER ============ -->
    <div class="profile-header">
      <div class="profile-avatar avatar-blue" id="profile-avatar" aria-hidden="true">•</div>
      <h1 class="profile-name" id="profile-name">—</h1>
      <p class="profile-meta" id="profile-meta">—</p>
      <p class="profile-bio" id="profile-bio"></p>
    </div>

    <!-- ============ STATS (same card style as home.html) ============ -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="icon-badge badge-blue">
          <svg viewBox="0 0 24 24" fill="white" stroke="none"><circle cx="12" cy="9" r="5"></circle><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5" fill="white"></path></svg>
        </div>
        <div>
          <p class="stat-label">Badges</p>
          <p class="stat-value" id="stat-badges">—</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-badge badge-teal">
          <svg viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4.5L6 21l1.5-7.5L2 9h7z"></path></svg>
        </div>
        <div>
          <p class="stat-label">Rating</p>
          <p class="stat-value" id="stat-rating">—</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-badge badge-gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="9" fill="white" stroke="none"></circle><text x="12" y="16.5" font-size="12" font-weight="800" text-anchor="middle" fill="#d18e00">$</text></svg>
        </div>
        <div>
          <p class="stat-label">Coins</p>
          <p class="stat-value" id="stat-points">—</p>
        </div>
      </div>
    </div>

    <!-- ============ TOPICS LEARNT ============ -->
    <section class="profile-section">
      <p class="section-heading">Topics learnt</p>
      <!-- profile.js fills this with real chips, or an empty-state note -->
      <div class="chip-row" id="topics-learnt-row"></div>
    </section>

    <!-- ============ TOPICS TAUGHT ============ -->
    <section class="profile-section">
      <p class="section-heading">Topics taught</p>
      <div class="chip-row" id="topics-taught-row"></div>
    </section>

    <!-- ============ BADGES EARNED ============ -->
    <section class="profile-section">
      <p class="section-heading">Badges earned</p>
      <div class="chip-row" id="badges-row"></div>
    </section>

    <!-- ============ QUICK LINKS ============ -->
    <div class="quick-links">
      <button type="button" class="link-row" data-action="Editing your profile">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </div>
        <span>Edit profile</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row" data-action="Saved">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg>
        </div>
        <span>Saved</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row" data-action="Settings">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2"></circle><line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2"></circle><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="18" r="2"></circle></svg>
        </div>
        <span>Settings</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row" data-action="Safety Center">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
        </div>
        <span>Safety Center</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <!-- ============ NEW FEATURES (visually separated + colored so
         they're actually noticed, not buried among the plain settings
         links above) ============ -->
    <div class="new-features-heading-row">
      <p class="section-heading">More ways to study</p>
      <span class="new-pill">NEW</span>
    </div>
    <div class="quick-links new-features-list">
      <button type="button" class="link-row link-row-new" data-action="Favorites">
        <div class="link-icon icon-pink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        </div>
        <span>Favorite partners</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row link-row-new" data-action="Find a teacher">
        <div class="link-icon icon-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        </div>
        <span>Find a teacher</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row link-row-new" data-action="Scheduled sessions">
        <div class="link-icon icon-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        </div>
        <span>Scheduled sessions</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row link-row-new" data-action="Quiz challenges">
        <div class="link-icon icon-orange">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4.5L6 21l1.5-7.5L2 9h7z"></path></svg>
        </div>
        <span>Quiz challenges</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row link-row-new" data-action="Invite a friend">
        <div class="link-icon icon-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>
        </div>
        <span>Invite a friend</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row link-row-new" data-action="Streak calendar">
        <div class="link-icon icon-gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path><path d="M8 14h2M13 14h2M8 17.5h2"></path></svg>
        </div>
        <span>Streak calendar</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <button type="button" id="logout-btn" class="logout-btn">Log out</button>
  </div>

  <script src="confirm-modal.js"></script>
  <script src="dark-mode.js"></script>
  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="profile.js?v=2"></script>
</body>
</html>
