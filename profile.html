<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="profile.css" />
  <link rel="stylesheet" href="confirm-modal.css" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Profile</p>
    </div>

    <!-- ============ HEADER ============ -->
    <div class="profile-header">
      <div class="profile-avatar avatar-blue" id="profile-avatar" aria-hidden="true">•</div>
      <h1 class="profile-name" id="profile-name">—</h1>
      <p class="profile-meta" id="profile-meta">—</p>
      <p class="profile-bio" id="profile-bio"></p>
    </div>

    <!-- ============ STATS (same card style as home.html) ============ -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="icon-badge badge-blue">
          <svg viewBox="0 0 24 24" fill="white" stroke="none"><circle cx="12" cy="9" r="5"></circle><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5" fill="white"></path></svg>
        </div>
        <div>
          <p class="stat-label">Badges</p>
          <p class="stat-value" id="stat-badges">—</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-badge badge-teal">
          <svg viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4.5L6 21l1.5-7.5L2 9h7z"></path></svg>
        </div>
        <div>
          <p class="stat-label">Rating</p>
          <p class="stat-value" id="stat-rating">—</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-badge badge-gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="9" fill="white" stroke="none"></circle><text x="12" y="16.5" font-size="12" font-weight="800" text-anchor="middle" fill="#d18e00">$</text></svg>
        </div>
        <div>
          <p class="stat-label">Coins</p>
          <p class="stat-value" id="stat-points">—</p>
        </div>
      </div>
    </div>

    <!-- ============ TOPICS LEARNT ============ -->
    <section class="profile-section">
      <p class="section-heading">Topics learnt</p>
      <!-- profile.js fills this with real chips, or an empty-state note -->
      <div class="chip-row" id="topics-learnt-row"></div>
    </section>

    <!-- ============ TOPICS TAUGHT ============ -->
    <section class="profile-section">
      <p class="section-heading">Topics taught</p>
      <div class="chip-row" id="topics-taught-row"></div>
    </section>

    <!-- ============ BADGES EARNED ============ -->
    <section class="profile-section">
      <p class="section-heading">Badges earned</p>
      <div class="chip-row" id="badges-row"></div>
    </section>

    <!-- ============ QUICK LINKS ============ -->
    <div class="quick-links">
      <button type="button" class="link-row" data-action="Editing your profile">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </div>
        <span>Edit profile</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row" data-action="Saved">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg>
        </div>
        <span>Saved</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row" data-action="Settings">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2"></circle><line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2"></circle><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="18" r="2"></circle></svg>
        </div>
        <span>Settings</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button type="button" class="link-row" data-action="Safety Center">
        <div class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
        </div>
        <span>Safety Center</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <button type="button" id="logout-btn" class="logout-btn">Log out</button>
  </div>

  <script src="confirm-modal.js"></script>
  <script src="api.js?v=5"></script>
  <script src="socket.io.min.js"></script>
  <script src="profile.js"></script>
</body>
</html>
