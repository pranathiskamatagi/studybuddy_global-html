<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=730" />
  <title>Quiz - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="quiz.css?v=3" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=3" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="teach-subject.html" class="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill"></div>
      </div>
    </div>

    <p class="kicker">Quiz</p>

    <!-- ============ QUIZ VIEW (shown while answering questions) ============ -->
    <div id="quiz-view">
      <div class="quiz-header">
        <h1 class="title" id="quiz-topic-title">Topic Quiz</h1>
        <span class="question-counter" id="question-counter">1/5</span>
      </div>

      <p class="question-text" id="question-text"></p>

      <!-- choose-subject.js fills this with 4 option buttons per question -->
      <div class="options-list" id="options-list"></div>

      <p id="quiz-error" class="form-error" hidden></p>

      <button type="button" id="save-next-btn" class="save-btn">Save &amp; Next</button>

      <div class="quiz-nav">
        <button type="button" id="back-q-btn" class="nav-text-btn">&larr; Back</button>
        <button type="button" id="next-q-btn" class="nav-text-btn">Next &rarr;</button>
      </div>

      <button type="button" id="submit-btn" class="submit-btn">Submit</button>
    </div>

    <!-- ============ GENERATING (topic wasn't in the local bank, asking AI) ============ -->
    <div id="generating-quiz-view" hidden>
      <div class="spinner" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path><circle cx="12" cy="12" r="4"></circle></svg>
      </div>
      <p class="no-quiz-text">Writing a quiz for this topic...</p>
    </div>

    <!-- ============ NO QUIZ AVAILABLE (topic isn't in the bank, and AI generation failed too) ============ -->
    <div id="no-quiz-view" hidden>
      <p class="no-quiz-text">We don't have quiz questions for this topic yet, but that's okay - you're all set to continue.</p>
      <button type="button" id="skip-btn" class="save-btn">Continue</button>
    </div>

    <!-- ============ RESULT VIEW (shown after finishing/submitting) ============ -->
    <div id="result-view" hidden>
      <div class="result-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      </div>
      <h1 class="title result-title">Quiz complete!</h1>
      <p class="result-score" id="result-score">You scored 0/5</p>
      <p class="result-message" id="result-message"></p>
      <button type="button" id="continue-btn" class="save-btn">Continue</button>
    </div>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="info-modal.js"></script>
  <script src="quiz.js?v=2"></script>
</body>
</html>
