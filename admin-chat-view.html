<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=584" />
  <title>Conversation - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin-chat-view.css?v=3" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="chat-header">
      <a href="admin.html" class="back-btn" aria-label="Back to conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">🛡 Admin · watching silently</p>
      <button type="button" id="cancel-session-btn" class="cancel-session-btn" hidden>Cancel session</button>
    </div>

    <!-- admin-chat-view.js fills this with the real message history, then
         keeps it live via a silent socket join (see sockets.py's
         'admin_watch' - never visible to the people actually chatting). -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- A real, visible intervention - unlike the silent watch above,
         sending this DOES show up in the live chat, clearly labeled as
         from Admin (see admin.py's warn_session). -->
    <form id="warn-form" class="warn-form">
      <input type="text" id="warn-input" placeholder="Send a warning into this chat..." />
      <button type="submit" class="warn-send-btn">Send</button>
    </form>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="admin-chat-view.js?v=2"></script>
</body>
</html>
