<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="leaderboard.css" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Leaderboard</p>
    </div>

    <!-- ============ PODIUM (top 3) ============ -->
    <!-- DOM order is 2nd-1st-3rd, matching how real podiums are laid
         out visually (winner in the tall middle spot). -->
    <div class="podium">
      <div class="podium-col">
        <div class="podium-avatar avatar-pink">S</div>
        <p class="podium-name">Sofia M.</p>
        <div class="pedestal pedestal-2">2</div>
      </div>
      <div class="podium-col rank-1">
        <svg class="crown" viewBox="0 0 24 24" fill="#f5a623" stroke="none"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8z"></path></svg>
        <div class="podium-avatar avatar-blue">A</div>
        <p class="podium-name">Aditi R.</p>
        <p class="podium-highest">Highest points</p>
        <div class="pedestal pedestal-1">1</div>
      </div>
      <div class="podium-col">
        <div class="podium-avatar avatar-orange">K</div>
        <p class="podium-name">Kabir S.</p>
        <div class="pedestal pedestal-3">3</div>
      </div>
    </div>

    <!-- ============ RANKED LIST ============ -->
    <div class="rank-list" id="rank-list"></div>

  </div>

  <script src="leaderboard.js"></script>
</body>
</html>
