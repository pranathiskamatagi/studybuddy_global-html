<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.85" />
  <title>Leaderboard - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="leaderboard.css?v=3" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Leaderboard</p>
    </div>

    <!-- ============ PODIUM (top 3) ============ -->
    <!-- DOM order is 2nd-1st-3rd, matching how real podiums are laid
         out visually (winner in the tall middle spot). -->
    <div class="podium" id="podium">
      <div class="podium-col" id="podium-2" hidden>
        <div class="podium-avatar" id="podium-2-avatar"></div>
        <p class="podium-name" id="podium-2-name"></p>
        <div class="pedestal pedestal-2">2</div>
      </div>
      <div class="podium-col rank-1" id="podium-1" hidden>
        <svg class="crown" viewBox="0 0 24 24" fill="#f5a623" stroke="none"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8z"></path></svg>
        <div class="podium-avatar" id="podium-1-avatar"></div>
        <p class="podium-name" id="podium-1-name"></p>
        <p class="podium-highest">Highest coins</p>
        <div class="pedestal pedestal-1">1</div>
      </div>
      <div class="podium-col" id="podium-3" hidden>
        <div class="podium-avatar" id="podium-3-avatar"></div>
        <p class="podium-name" id="podium-3-name"></p>
        <div class="pedestal pedestal-3">3</div>
      </div>
    </div>

    <!-- ============ RANKED LIST ============ -->
    <div class="rank-list" id="rank-list"></div>
    <p class="empty-state" id="empty-state" hidden>No one's earned coins yet - be the first!</p>

  </div>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="dark-mode.js"></script>
  <script src="leaderboard.js?v=3"></script>
</body>
</html>
