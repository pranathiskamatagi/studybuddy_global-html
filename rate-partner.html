<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.65, minimum-scale=0.5" />
  <title>Ratings - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="rate-partner.css?v=4" />
  <link rel="stylesheet" href="points-popup.css?v=4" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <!-- ============ RATING VIEW ============ -->
    <div id="rating-view">
      <p class="kicker">Ratings</p>
      <h1 class="title">Rate your partner</h1>

      <!-- rate-partner.js fills these in from the URL, passed along by
           session-end.js: partner name, country, and the topic they helped with. -->
      <div class="summary-box">
        <p class="summary-line" id="summary-name-country">—</p>
        <p class="summary-line summary-topic" id="summary-topic">—</p>
      </div>

      <div class="star-row" id="star-row">
        <button type="button" class="star-btn" data-value="1" aria-label="1 star">★</button>
        <button type="button" class="star-btn" data-value="2" aria-label="2 stars">★</button>
        <button type="button" class="star-btn" data-value="3" aria-label="3 stars">★</button>
        <button type="button" class="star-btn" data-value="4" aria-label="4 stars">★</button>
        <button type="button" class="star-btn" data-value="5" aria-label="5 stars">★</button>
      </div>

      <div class="field">
        <label for="comment">Comment</label>
        <textarea id="comment" rows="3" placeholder="Type here"></textarea>
      </div>

      <p class="badge-label">Give your partner a badge</p>
      <div class="badge-list" id="badge-list">
        <button type="button" class="badge-option" data-badge="Great Explainer">🌟 Great Explainer</button>
        <button type="button" class="badge-option" data-badge="Patient">🙌 Patient</button>
        <button type="button" class="badge-option" data-badge="Well Prepared">📚 Well Prepared</button>
      </div>

      <!-- Clicking this reveals a text input so someone can type a badge
           name that isn't one of the 3 presets above. -->
      <button type="button" id="choose-own-btn" class="choose-own-btn">Choose my own</button>
      <input type="text" id="custom-badge-input" class="custom-badge-input" placeholder="Type your own badge..." hidden />

      <p id="rate-error" class="form-error" hidden></p>

      <button type="button" id="submit-rating-btn" class="submit-btn">Submit rating</button>
    </div>

    <!-- ============ LOW RATING FOLLOW-UP ============ -->
    <!-- Only shown when the rating just submitted was 3 stars or under -
         rate-partner.js decides that, this whole view is skippable. -->
    <div id="low-rating-view" hidden>
      <p class="kicker">Ratings</p>
      <h1 class="title">What went wrong?</h1>
      <p class="summary-line">This helps us understand what happened - totally optional.</p>

      <div class="badge-list" id="feedback-reasons-list">
        <button type="button" class="badge-option feedback-reason" data-reason="Partner was unprepared">Partner was unprepared</button>
        <button type="button" class="badge-option feedback-reason" data-reason="Explanations weren't clear">Explanations weren't clear</button>
        <button type="button" class="badge-option feedback-reason" data-reason="Partner seemed distracted">Partner seemed distracted</button>
        <button type="button" class="badge-option feedback-reason" data-reason="Session felt rushed">Session felt rushed</button>
        <button type="button" class="badge-option feedback-reason" data-reason="Technical issues (connection/audio)">Technical issues (connection/audio)</button>
        <button type="button" class="badge-option feedback-reason" data-reason="Partner was disrespectful">Partner was disrespectful</button>
        <button type="button" class="badge-option feedback-reason" data-reason="Other">Other</button>
      </div>

      <div class="field">
        <label for="feedback-detail">Anything else? (optional)</label>
        <textarea id="feedback-detail" rows="3" placeholder="Type here"></textarea>
      </div>

      <button type="button" id="submit-feedback-btn" class="submit-btn">Submit feedback</button>
      <button type="button" id="skip-feedback-btn" class="choose-own-btn">Skip</button>
    </div>

    <!-- ============ CONFIRMATION VIEW ============ -->
    <div id="confirmation-view" hidden>
      <div class="success-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      </div>
      <h1 class="title">Thanks for rating!</h1>
      <p class="confirmation-detail" id="confirmation-detail">—</p>
      <p class="points-earned">+10 coins earned</p>
      <button type="button" id="continue-btn" class="submit-btn">Continue</button>
    </div>
  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="sound.js"></script>
  <script src="points-popup.js"></script>
  <script src="rate-partner.js"></script>
</body>
</html>
