<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=435" />
  <title>Find a Teacher - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="browse-teachers.css?v=1" />
  <link rel="stylesheet" href="profile-view-modal.css?v=3" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=6" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="profile.html" class="back-btn" id="back-btn" aria-label="Back to profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Profile</p>
    </div>

    <h1 class="title">Find a teacher</h1>
    <p class="subtitle">Browse real people by a subject they've marked as confident teaching.</p>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input type="text" id="subject-search" placeholder="Search a subject (e.g. Calculus)" />
    </div>

    <!-- browse-teachers.js builds one row per matching person in here -->
    <div class="teacher-list" id="teacher-list"></div>

    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      </div>
      <p class="empty-title" id="empty-title">No one yet</p>
      <p class="empty-desc" id="empty-desc">Nobody's marked this subject as one they teach yet.</p>
    </div>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="profile-view-modal.js?v=4"></script>
  <script src="browse-teachers.js"></script>
</body>
</html>
