<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=730" />
  <title>Notifications - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="notifications.css?v=6" />
  <link rel="stylesheet" href="points-popup.css?v=4" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <link rel="stylesheet" href="phone-zoom.css?v=2" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Notifications</p>
    </div>

    <div class="header-row">
      <h1 class="title">Recent activity</h1>
      <div class="header-actions">
        <button type="button" id="mark-all-btn" class="mark-all-btn">Mark all read</button>
        <button type="button" id="clear-all-btn" class="clear-all-btn" aria-label="Clear all notifications" hidden>Clear all</button>
      </div>
    </div>

    <!-- notifications.js builds one row per notification in here -->
    <div class="notif-list" id="notif-list"></div>

    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      </div>
      <p class="empty-title">You're all caught up</p>
      <p class="empty-desc">New activity will show up here.</p>
    </div>
  </div>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="info-modal.js"></script>
  <script src="dark-mode.js"></script>
  <script src="sound.js"></script>
  <script src="points-popup.js"></script>
  <script src="notifications.js?v=10"></script>
</body>
</html>
