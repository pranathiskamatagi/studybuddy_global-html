<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Conversations - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css?v=3" />
  <link rel="stylesheet" href="admin-sessions.css?v=4" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="admin.html" class="back-btn" aria-label="Back to admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">🛡 Admin</p>
    </div>

    <h1 class="title">Conversations</h1>
    <p class="subtitle">Newest first, grouped by day.</p>

    <input type="text" id="session-search-input" class="session-search-input" placeholder="Search by subject or topic..." />

    <!-- admin-sessions.js fills this with one chip per real subject that
         actually has conversations - "All" jumps back to showing everyone. -->
    <div class="subject-filter-row" id="subject-filter-row"></div>

    <div class="session-list" id="session-list"></div>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="confirm-modal.js"></script>
  <script src="admin-sessions.js?v=5"></script>
</body>
</html>
