<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.75" />
  <title>Scheduled Sessions - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="scheduled-sessions.css?v=3" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="profile.html" class="back-btn" id="back-btn" aria-label="Back to profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Profile</p>
    </div>

    <div class="top-actions-row">
      <div>
        <h1 class="title">Scheduled sessions</h1>
        <p class="subtitle">Alongside instant matching - agree on a real time with someone, in advance.</p>
      </div>
      <!-- Scheduling now starts from "I wanna learn"/"I wanna teach" ->
           Schedule for later, same place as an instant search starts -
           this just links there instead of duplicating that whole flow. -->
      <a href="choose-subject.html" class="add-fab" aria-label="Propose a new session">+</a>
    </div>

    <!-- scheduled-sessions.js builds one row per scheduled session in here -->
    <div class="scheduled-list" id="scheduled-list"></div>

    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      </div>
      <p class="empty-title">Nothing scheduled</p>
      <p class="empty-desc">Click a study partner's name anywhere in the app to propose a time.</p>
    </div>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="scheduled-sessions.js?v=4"></script>
</body>
</html>
