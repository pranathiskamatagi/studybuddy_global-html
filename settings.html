<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=435" />
  <title>Settings - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="settings.css?v=2" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=6" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" id="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Settings</p>
    </div>

    <p class="section-heading">Preferences</p>
    <div class="settings-group">
      <label class="toggle-row">
        <span>Sound effects</span>
        <input type="checkbox" id="toggle-sound" checked />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
      <label class="toggle-row">
        <span>Dark mode</span>
        <input type="checkbox" id="toggle-dark" />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
    </div>

    <p class="section-heading">Notifications</p>
    <div class="settings-group">
      <a href="notification-settings.html" class="link-row" id="notification-settings-link">
        <span>Notification settings</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </div>

    <p class="section-heading">Account</p>
    <div class="settings-group">
      <a href="change-password.html" class="link-row" id="change-password-link">
        <span>Change password</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="blocked-users.html" class="link-row" id="blocked-users-link">
        <span>Blocked users</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </div>

    <button type="button" id="logout-btn" class="logout-btn">Log out</button>
  </div>

  <script src="confirm-modal.js"></script>
  <script src="sound.js"></script>
  <script src="dark-mode.js"></script>
  <script src="settings.js?v=2"></script>
</body>
</html>
