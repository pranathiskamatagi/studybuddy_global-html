<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.75" />
  <title>Conversation Summary - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css?v=5" />
  <link rel="stylesheet" href="admin-conversations.css?v=1" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="admin.html" class="back-btn" aria-label="Back to admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">🛡 Admin</p>
    </div>

    <h1 class="title">Conversation summary</h1>
    <p class="subtitle" id="conv-total">Who talked with whom, and when. Messages are never shown here.</p>

    <p class="section-heading">By day</p>
    <div class="conv-list" id="day-list"></div>

    <p class="section-heading">Who talked with whom</p>
    <div class="conv-list" id="people-list"></div>

    <p class="empty-note" id="empty-note" hidden>No conversations yet.</p>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="admin-conversations.js"></script>
</body>
</html>
