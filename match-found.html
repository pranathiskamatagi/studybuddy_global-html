<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Found - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="match-found.css?v=3" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="phone-zoom.css?v=1" />
</head>
<body>

  <div class="app-screen">

    <div id="found-view">
      <div class="top-row">
        <button type="button" id="back-btn" class="back-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
      </div>

      <p class="kicker">Match found!</p>

      <!-- match-found.js fills in a real matched person's initial,
           name, and rating here on page load. -->
      <div class="partner-avatar" id="partner-avatar" aria-hidden="true"></div>
      <h1 class="title" id="partner-name">—</h1>
      <p class="partner-rating" id="partner-rating"></p>

      <p class="match-desc" id="match-desc">You're all set to connect.</p>

      <div class="tag-row">
        <span class="tag" id="tag-subject"></span>
        <span class="tag" id="tag-country"></span>
      </div>

      <!-- match-found.js fills this in from the backend's real scoring
           reason (matching.py) when there is one - hidden otherwise,
           never a made-up explanation. -->
      <p class="match-reason" id="match-reason" hidden></p>

      <button type="button" id="start-session-btn" class="start-btn">
        Start Session
        <span class="arrow">→</span>
      </button>

      <button type="button" id="find-other-btn" class="other-link">Find someone else</button>
    </div>
  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="sound.js"></script>
  <script src="match-found.js?v=4"></script>
</body>
</html>
