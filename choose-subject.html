<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=584" />
  <title>Choose Subject - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="choose-subject.css?v=8" />
  <link rel="stylesheet" href="date-time-picker.css?v=5" />
  <link rel="stylesheet" href="people-picker.css" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <script src="phone-fit.js"></script>
  <link rel="stylesheet" href="phone-zoom.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill"></div>
      </div>
    </div>

    <p class="kicker">I wanna learn</p>
    <h1 class="title">Choose subject &amp; topic</h1>
    <p class="subtitle">Tell us what you'd like to learn and we'll match you with the right study partner.</p>

    <form id="choose-form" novalidate>

      <div class="field">
        <label for="subject">Subject</label>
        <div class="select-wrap">
          <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10 4.5 7 4 4 4v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"></path></svg>
          <!-- A text input paired with a <datalist> (via the "list"
               attribute) shows suggestions as you type, but - unlike a
               <select> - still lets you type absolutely anything. -->
          <input type="text" id="subject" list="subject-options" placeholder="Select or type a subject" autocomplete="off" />
          <datalist id="subject-options">
            <!-- Options are filled in below by choose-subject.js. -->
          </datalist>
        </div>
      </div>

      <div class="field">
        <label for="topic">Topic</label>
        <div class="select-wrap">
          <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
          <!-- choose-subject.js fills this with every topic up front, then
               narrows the SUGGESTIONS once a subject is picked - typing a
               topic not in the list (like "Chemical Bonding") still works fine. -->
          <input type="text" id="topic" list="topic-options" placeholder="Select or type a topic" autocomplete="off" />
          <datalist id="topic-options"></datalist>
        </div>
      </div>

      <!-- ============ RECENT SEARCHES (clickable chips) ============ -->
      <!-- choose-subject.js fills this in with this user's REAL past
           searches (from the backend) - hidden entirely until there's at
           least one real one, never seeded with fake examples. -->
      <div class="chip-section" id="recent-section" hidden>
        <p class="chip-heading">Recent searches</p>
        <div class="chip-row" id="recent-chips"></div>
      </div>

      <!-- ============ RECOMMENDED (clickable chips) ============ -->
      <div class="chip-section">
        <p class="chip-heading">Recommended for you</p>
        <div class="chip-row" id="recommended-chips">
          <button type="button" class="chip chip-recommended" data-subject="Science" data-topic="Physics Fundamentals">Physics Fundamentals</button>
          <button type="button" class="chip chip-recommended" data-subject="Computer Science" data-topic="Data Structures">Data Structures</button>
          <button type="button" class="chip chip-recommended" data-subject="Mathematics" data-topic="Algebra II">Algebra II</button>
          <button type="button" class="chip chip-recommended" data-subject="Languages" data-topic="French Basics">French Basics</button>
          <button type="button" class="chip chip-recommended" data-subject="Science" data-topic="Biology 101">Biology 101</button>
        </div>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <button type="submit" class="find-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        Find study partner
      </button>

      <button type="button" class="schedule-later-btn" id="schedule-later-toggle-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        Schedule for later instead
      </button>

      <!-- Revealed only after clicking the button above - a real future
           time instead of searching right now (see choose-subject.js). -->
      <div class="schedule-later-form" id="schedule-later-form" hidden>
        <label id="schedule-later-time-label">When do you want to study this?</label>
        <!-- date-time-picker.js builds the real calendar + time-slot
             widget inside this, in place of a native date/time input. -->
        <div id="schedule-later-datetime"></div>

        <button type="button" class="pick-person-toggle-btn" id="pick-person-toggle-btn">🎯 Want a specific person? (optional)</button>

        <!-- Revealed only after clicking the toggle above. -->
        <div class="pick-person-panel" id="pick-person-panel" hidden>
          <p class="pick-person-heading" id="pick-person-heading" hidden>Recommended - they teach this</p>
          <div class="pick-person-list" id="pick-person-recommend-list"></div>
          <button type="button" class="pick-person-search-btn" id="pick-person-search-btn">🔍 Search for someone else</button>
          <div class="pick-person-chosen" id="pick-person-chosen" hidden>
            Sending to <strong id="pick-person-chosen-name"></strong>
            <button type="button" id="pick-person-clear-btn" aria-label="Remove">✕</button>
          </div>
        </div>

        <button type="button" class="schedule-later-submit-btn" id="schedule-later-submit-btn">Post request</button>
      </div>
    </form>
  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="people-picker.js"></script>
  <script src="date-time-picker.js?v=4"></script>
  <script src="info-modal.js"></script>
  <script src="choose-subject.js?v=6"></script>
</body>
</html>
