<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Summary - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="ai-summary.css?v=4" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=5" />
  <link rel="stylesheet" href="phone-zoom.css?v=1" />
</head>
<body>

  <div class="app-screen">

    <p class="kicker">AI</p>
    <div class="request-badge">Give me mind map and summary</div>

    <!-- Shown briefly while ai-summary.js "generates" the content below -->
    <div id="loading-view">
      <div class="spinner" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path><circle cx="12" cy="12" r="4"></circle></svg>
      </div>
      <p class="loading-text">Generating your summary...</p>
    </div>

    <!-- Hidden until the "generation" finishes -->
    <div id="result-view" hidden>
      <h2 class="section-heading">Mind map</h2>
      <div class="mindmap">
        <div class="mindmap-central" id="mindmap-topic">Topic</div>
      </div>

      <!-- ai-summary.js fills this with however many real branches Gemini
           returned - as many or as few as the conversation actually had,
           no fixed count, the page just scrolls if it's long. -->
      <div class="branch-details" id="branch-details"></div>

      <h2 class="section-heading">Summary</h2>
      <div class="summary-card">
        <ul class="summary-list" id="summary-list"></ul>
      </div>

      <!-- Saves this topic to localStorage (see ai-summary.js) so it
           shows up later on the Saved screen. -->
      <button type="button" id="save-btn" class="save-summary-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg>
        <span id="save-btn-text">Save this summary</span>
      </button>

      <!-- Turns the same real branches above into flashcards to review
           later - see flashcards.js. -->
      <button type="button" id="flashcards-btn" class="flashcards-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="10" rx="2"></rect><rect x="7" y="9" width="14" height="10" rx="2"></rect></svg>
        Practice with flashcards
      </button>
    </div>

    <!-- Shown for a real session that didn't have enough real chat yet to
         honestly summarize - instead of pretending there's a mind map. -->
    <div id="unavailable-view" hidden>
      <p class="unavailable-text">Not enough of a conversation yet to generate a real summary - chat a bit more first, then come back.</p>
    </div>

    <button type="button" id="back-btn" class="home-link-btn">Back to session end</button>
  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="socket.io.min.js"></script>
  <script src="ai-summary.js?v=4"></script>
</body>
</html>
