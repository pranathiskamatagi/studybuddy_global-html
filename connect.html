<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect - StudyBuddy Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Reuses home.css for the session/request card styles - they're
       identical, so there's no reason to duplicate ~100 lines of CSS. -->
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="connect.css" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="home.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">Connect</p>
    </div>

    <!-- ============ ALL ACTIVE STUDY SESSIONS ============ -->
    <!-- Whole section starts hidden - connect.js only reveals it once
         there are real active groups to show. -->
    <section class="section-block" id="sessions-section" hidden>
      <div class="section-header">
        <h2>Active study sessions <span class="live-badge">Live</span></h2>
      </div>
      <div class="sessions-row" id="sessions-row"></div>
    </section>

    <!-- ============ ALL COMMUNITY REQUESTS ============ -->
    <section class="section-block" id="requests-section" hidden>
      <div class="section-header">
        <h2>Community requests</h2>
      </div>
      <div class="requests-list" id="requests-list"></div>
    </section>

  </div>

  <script src="api.js?v=5"></script>
  <script src="socket.io.min.js"></script>
  <script src="connect.js?v=3"></script>
</body>
</html>
