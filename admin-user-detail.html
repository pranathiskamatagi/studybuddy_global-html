<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.85" />
  <title>User History - Learnora</title>
  <link rel="icon" type="image/png" href="icon-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css?v=5" />
  <link rel="stylesheet" href="admin-user-detail.css?v=1" />
  <link rel="stylesheet" href="confirm-modal.css" />
  <link rel="stylesheet" href="dark-mode.css?v=8" />
  <link rel="stylesheet" href="full-width-layout.css?v=4" />
</head>
<body>

  <div class="app-screen">

    <div class="top-row">
      <a href="admin-users.html" class="back-btn" id="back-btn" aria-label="Back to users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <p class="kicker">🛡 Admin</p>
    </div>

    <!-- admin-user-detail.js fills all of this with the real person -->
    <div class="ud-header">
      <div class="ud-avatar" id="ud-avatar"></div>
      <div>
        <p class="ud-name" id="ud-name">Loading...</p>
        <p class="ud-email" id="ud-email"></p>
      </div>
    </div>
    <div class="ud-stats-row" id="ud-stats-row"></div>

    <div class="ud-tabs">
      <button type="button" class="ud-tab active" data-tab="conversations">Conversations</button>
      <button type="button" class="ud-tab" data-tab="ratings-received">Ratings received</button>
      <button type="button" class="ud-tab" data-tab="ratings-given">Ratings given</button>
    </div>

    <div class="ud-panel" id="ud-panel-conversations"></div>
    <div class="ud-panel" id="ud-panel-ratings-received" hidden></div>
    <div class="ud-panel" id="ud-panel-ratings-given" hidden></div>

  </div>
  <script src="dark-mode.js"></script>

  <script src="api.js?v=7"></script>
  <script src="confirm-modal.js"></script>
  <script src="admin-user-detail.js?v=1"></script>
</body>
</html>
